<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>DEATHBYTE — Premium Digital Identity</title>
<meta name="description" content="DEATHBYTE — a premium digital identity and secure contact hub. Connect via Instagram, Telegram, and WhatsApp." />
<link rel="canonical" href="https://www.deathbyte0x.win/" />
<meta name="theme-color" content="#000000" />
<meta name="robots" content="index,follow" />

<!-- Open Graph -->
<meta property="og:type" content="website" />
<meta property="og:title" content="DEATHBYTE" />
<meta property="og:description" content="Premium digital identity. Encrypted presence." />
<meta property="og:url" content="https://www.deathbyte0x.win/" />
<meta property="og:image" content="https://www.deathbyte0x.win/og-image.png" />
<meta property="og:site_name" content="DEATHBYTE" />

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="DEATHBYTE" />
<meta name="twitter:description" content="Premium digital identity. Encrypted presence." />
<meta name="twitter:image" content="https://www.deathbyte0x.win/og-image.png" />

<link rel="manifest" href="/site.webmanifest" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ctext x='50%25' y='58%25' text-anchor='middle' font-family='monospace' font-size='36' fill='%23fff'%3ED%3C/text%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="/style.css" />

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "DEATHBYTE",
  "url": "https://www.deathbyte0x.win/",
  "sameAs": [
    "https://instagram.com/deathbyte0x",
    "https://t.me/deathbyte0x",
    "https://t.me/about_deathbyte"
  ]
}
</script>
</head>
<body>

<canvas id="particles" aria-hidden="true"></canvas>
<div class="grid" aria-hidden="true"></div>
<div class="glow glow-a" aria-hidden="true"></div>
<div class="glow glow-b" aria-hidden="true"></div>

<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <span class="brand-name" id="brand-name">DEATHBYTE</span>
    <span class="status">online</span>
  </div>
  <nav aria-label="Primary">
    <a href="#links">Links</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<main id="main">

  <section class="hero">
    <p class="eyebrow">// digital identity</p>
    <h1 id="hero-title" class="hero-title">DEATHBYTE</h1>
    <p id="hero-tagline" class="tagline">Premium digital identity. Encrypted presence.</p>
    <p id="hero-bio" class="bio">
      A single, secure point of contact across every channel.
    </p>
    <div class="cta">
      <a class="btn primary" href="#links">Explore Links</a>
      <a class="btn ghost" href="#contact">Send Message</a>
    </div>
  </section>

  <section id="links" class="links">
    <h2 class="section-title">// channels</h2>
    <div class="cards" id="cards" role="list"></div>
  </section>

  <section id="contact" class="contact">
    <h2 class="section-title">// transmit</h2>
    <form id="contact-form" novalidate autocomplete="off">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required minlength="2" maxlength="80" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required maxlength="160" />
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" required minlength="10" maxlength="2000" rows="5"></textarea>
      </div>
      <!-- Honeypot -->
      <input type="text" name="company" id="company" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true" />
      <button type="submit" class="btn primary" id="send-btn">Send</button>
      <p id="form-status" role="status" aria-live="polite"></p>
    </form>
  </section>

</main>

<footer>
  <p>© <span id="year"></span> DEATHBYTE. All rights reserved.</p>
  <p class="small">deathbyte0x.win</p>
</footer>

<script src="/script.js" defer></script>
</body>
</html>
